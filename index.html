<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl border border-stone-200 shadow-sm">
      <div>
        <h1 class="text-2xl font-black text-stone-900 tracking-tight">📦 Warehouse Inventory</h1>
        <p class="text-xs md:text-sm text-stone-500 mt-1">Order: Endpaper → BXT → Lazer/Inkjet → Casing-in → Other</p>
      </div>
      <div id="current-date" class="text-xs md:text-sm font-semibold text-stone-700 bg-stone-50 px-4 py-2.5 rounded-2xl border border-stone-200">
      </div>
    </header>

    <!-- Control Panel -->
   <div class="flex items-center gap-2">
  <button 
    type="button"
    id="export-excel-btn" 
    class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-colors shadow-sm cursor-pointer"
  >
    📊 Скачать в Excel
  </button>
  <button 
    type="button"
    id="open-modal-btn" 
    class="bg-stone-900 hover:bg-stone-800 text-white px-5 py-2 rounded-xl text-sm font-semibold transition-colors shadow-sm cursor-pointer"
  >
    + Add Product
  </button>
</div>
    <!-- Blocks Container -->
    <div id="blocks-container" class="space-y-6">
      <div class="bg-white p-8 rounded-3xl border border-stone-200 text-center text-stone-400">
        Loading inventory...
      </div>
    </div>

  </div>

  <!-- Модальное окно -->
  <div id="add-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 border border-stone-200 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 id="modal-title" class="text-lg font-bold text-stone-900">📦 Add New Product</h3>
        <button type="button" id="close-modal-btn" class="text-stone-400 hover:text-stone-600 text-lg font-bold px-2 cursor-pointer">✕</button>
      </div>

      <form id="product-form" class="space-y-3">
        <input type="hidden" id="edit-product-id">

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Product Name *</label>
          <input type="text" id="product-name" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-400" placeholder="e.g. Endpaper Red">
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Category (Block) *</label>
          <select id="product-category" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-400">
            <option value="Endpaper">Endpaper</option>
            <option value="BXT">BXT</option>
            <option value="Lazer/Inkjet">Lazer/Inkjet</option>
            <option value="Casing-in">Casing-in</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Size / Dimensions (free text)</label>
          <input type="text" id="product-size" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-400" placeholder="100 см or 50-20 см">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">Quantity *</label>
            <input type="number" id="product-quantity" required min="0" step="any" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-400" placeholder="e.g. 100">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">Unit *</label>
            <select id="product-unit" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-400">
              <option value="pcs">pcs (pieces)</option>
              <option value="cm">cm (centimeters)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Min. Stock Alert</label>
          <input type="number" id="product-min-stock" min="0" value="5" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-stone-400">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancel-modal-btn" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 text-sm font-semibold rounded-xl transition-colors cursor-pointer">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-stone-900 hover:bg-stone-800 text-white text-sm font-semibold rounded-xl transition-colors shadow-sm cursor-pointer">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=200"></script>
</body>
</html>
